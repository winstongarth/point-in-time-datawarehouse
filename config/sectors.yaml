# GICS-style sector for every ticker in config/universe.yaml, used only to
# sector-neutralise the composite score (subtract each sector's mean).
#
# Without neutralisation a value tilt across mega caps is mostly "long energy
# and banks, short software" - a sector bet dressed up as a stock-selection
# bet, and one that swamps the factor signal it is meant to express.
#
# These are *today's* classifications applied to all of history (see
# docs/limitations.md): a static map, like config/universe.yaml itself. GE in
# 2017 was a sprawling conglomerate and is classified Industrials here
# throughout; that is a known simplification, not an oversight.
sectors:
  AAPL: information_technology
  MSFT: information_technology
  GOOGL: communication_services
  AMZN: consumer_discretionary
  NVDA: information_technology
  META: communication_services
  BRK.B: financials
  TSLA: consumer_discretionary
